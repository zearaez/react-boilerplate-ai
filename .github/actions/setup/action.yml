name: Setup
description: Node, pnpm (via the packageManager field), and a warm turbo cache

runs:
  using: composite
  steps:
    - name: Enable corepack
      shell: bash
      # pnpm's version comes from the `packageManager` field in package.json, so
      # there is exactly one place it is declared.
      run: corepack enable

    - name: Setup Node
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Restore turbo cache
      uses: actions/cache@640a1c2554105b57832a23eea0b4672fc7a790d5 # v4.2.3
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-
