name: Deploy web

on:
  push:
    branches: [uat, prod]
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Vercel (${{ github.ref_name }})
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'prod' && 'production' || 'uat' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Sentry needs history to associate a release with commits.
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Build
        run: pnpm --filter @repo/web build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_ENABLE_MOCKS: 'false'
          VITE_APP_ENV: ${{ github.ref_name == 'prod' && 'production' || 'uat' }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Verify the production CSS
        run: node scripts/assert-css-output.mjs apps/web/dist

      - name: Deploy
        run: pnpm dlx vercel@latest deploy --prebuilt --yes ${{ github.ref_name == 'prod' && '--prod' || '' }}
        working-directory: apps/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Is Sentry configured?
        id: sentry
        # The `secrets` context is not reliably usable in an `if:` expression, so
        # it is mapped to an output here and the step below gates on that.
        run: echo "enabled=${{ secrets.SENTRY_AUTH_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Create the Sentry release and upload sourcemaps
        # Without sourcemaps a production stack trace is minified noise, which
        # makes the error tracking a checkbox rather than a tool.
        if: steps.sentry.outputs.enabled == 'true'
        run: |
          pnpm dlx @sentry/cli@latest releases new "${{ github.sha }}"
          pnpm dlx @sentry/cli@latest sourcemaps inject apps/web/dist
          pnpm dlx @sentry/cli@latest sourcemaps upload apps/web/dist
          pnpm dlx @sentry/cli@latest releases set-commits "${{ github.sha }}" --auto
          pnpm dlx @sentry/cli@latest releases finalize "${{ github.sha }}"
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
