name: Quality

# Audit item 3.4: runs on EVERY protected target branch, not just main. This is
# the single most common gap in our repos — a deploy-only workflow means nothing
# is checked until after merge.
on:
  pull_request:
    branches: [main, prod, uat, develop, 'v[0-9]+.[0-9]+.[0-9]+']
  push:
    branches: [develop, uat, prod, main]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  static:
    name: Lint, types, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format
        run: pnpm format:check

      - name: Assert one copy of each singleton dependency
        # Two Reacts present as "Invalid hook call" at runtime with a stack trace
        # pointing at the wrong library. Cheaper to catch here.
        run: node scripts/assert-single-version.mjs

      - name: Assert design tokens are in sync
        # Fails if apps/*/global.css was hand-edited or is stale.
        run: |
          pnpm tokens:sync
          git diff --exit-code -- apps/web/src/global.css apps/mobile/global.css

  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup

      - name: Vitest with coverage thresholds
        # Fails below the thresholds in vitest.config.ts (audit item 15.5).
        run: pnpm test:coverage

      - name: Jest (mobile)
        run: pnpm test:mobile

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build-web:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup

      - name: Build
        run: pnpm --filter @repo/web build
        env:
          VITE_API_URL: https://example.invalid
          VITE_ENABLE_MOCKS: 'false'

      - name: Assert the production CSS actually contains the tokens
        # Tailwind and Rolldown both remove CSS they think is unused, and both
        # have been wrong here. Dev looking fine proves nothing.
        run: node scripts/assert-css-output.mjs apps/web/dist

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup

      - name: Install the browser
        # Only chromium, and only its deps: the full `--with-deps` install of all
        # three engines is minutes of CI time for no extra signal here.
        run: pnpm --filter @repo/web exec playwright install --with-deps chromium

      - name: Run the demo flow against the production build
        # playwright.config.ts builds and previews with mocks on, so no backend is
        # needed. This is the only check that would notice the app being broken
        # while every unit test passes — it already caught a missing hydrate() call
        # and a loader that threw before the auth guard could redirect.
        run: pnpm test:e2e

      - name: Smoke-test the dev server
        # Everything above this line runs against the production build, which left
        # `vite dev` — the environment developers use all day — with no gate on it.
        # Three specs, ~3 seconds: does it boot, does anything Node-only leak into
        # the browser, does logger output reach the console.
        run: pnpm test:e2e:dev

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  mobile-check:
    name: Expo checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup

      - name: expo-doctor
        # Not a local bin in SDK 57 — the package.json script runs it via dlx.
        run: pnpm --filter @repo/mobile run doctor

      - name: Dependency versions match the SDK
        run: pnpm --filter @repo/mobile exec expo install --check

      - name: Export bundles
        # This is the mobile "build" signal on a Linux runner. It catches bad
        # imports, missing assets, Metro resolution errors, plugin
        # misconfiguration and broken NativeWind transforms — everything a PR
        # realistically breaks. Native compilation only catches native-module and
        # config-plugin problems, which change rarely, so Android prebuild runs
        # nightly and iOS goes through EAS. See docs/delivery.md.
        run: pnpm --filter @repo/mobile exec expo export --platform all --output-dir dist

      - name: Assert NativeWind styles reached the native bundle
        # The scariest mobile failure mode is silent: a missing jsxImportSource or
        # a babel plugin ordering change makes every className a no-op with no
        # error anywhere. This greps the built bundle for proof.
        run: node scripts/assert-native-styles.mjs apps/mobile/dist

  # The single required status check. Adding a job above without adding it here
  # would let it fail silently, so `needs` lists every one.
  ci-ok:
    name: CI OK
    if: always()
    needs: [static, test, build-web, e2e, mobile-check]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every job succeeded
        run: |
          if echo '${{ join(needs.*.result, ' ') }}' | grep -qvw success; then
            echo "One or more jobs did not succeed: ${{ join(needs.*.result, ', ') }}"
            exit 1
          fi
          echo "All checks passed."
