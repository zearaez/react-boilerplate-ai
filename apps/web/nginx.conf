server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the version.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Content-hashed filenames — safe to cache indefinitely.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /health {
        add_header Cache-Control "no-store";
        default_type application/json;
        try_files /health.json =404;
    }

    # The service worker must never be cached, or clients get stuck on an old one.
    location = /mockServiceWorker.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # SPA fallback: React Router owns routing, so unknown paths serve index.html.
    location / {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
